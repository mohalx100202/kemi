<script>
function lw(N,B,D){let s="";B.forEach(([i,j,n])=>{const [x1,y1]=N[i],[x2,y2]=N[j],dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy),ux=dx/l,uy=dy/l;for(let k=0;k<n;k++){const o=(k-(n-1)/2)*4;s+=`<line x1="${x1+ux*11-uy*o}" y1="${y1+uy*11+ux*o}" x2="${x2-ux*11-uy*o}" y2="${y2-uy*11+ux*o}" stroke="currentColor" stroke-width="2"/>`}});N.forEach(([x,y,t])=>s+=`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="currentColor">${t}</text>`);D.forEach(([x,y,v])=>{const a=v?[0,3]:[3,0];s+=`<circle cx="${x-a[0]}" cy="${y-a[1]}" r="1.8" fill="currentColor"/><circle cx="${x+a[0]}" cy="${y+a[1]}" r="1.8" fill="currentColor"/>`});return `<svg viewBox="0 0 120 100" width="130" style="color:var(--tx)">${s}</svg>`}
function atom(){let s="";[28,52].forEach(r=>s+=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="#888"/>`);s+=`<circle cx="70" cy="70" r="15" fill="#e8a0a0" stroke="#a55"/><text x="70" y="67" text-anchor="middle" font-size="8" fill="#400">6p</text><text x="70" y="77" text-anchor="middle" font-size="8" fill="#400">6n</text>`;[[28,[0,180]],[52,[45,135,225,315]]].forEach(([r,as])=>as.forEach(a=>{const t=a*Math.PI/180;s+=`<circle cx="${70+r*Math.cos(t)}" cy="${70+r*Math.sin(t)}" r="4" fill="#3b5bdb"/>`}));return `<svg viewBox="0 0 140 140" width="150">${s}</svg>`}
const T4=[[60,14,"X"],[60,86,"H"],[22,50,"H"],[98,50,"H"]];
const tet=c=>lw([[60,50,c],[60,14,"H"],[60,86,"H"],[22,50,"H"],[98,50,"H"]],[[0,1,1],[0,2,1],[0,3,1],[0,4,1]],[]);
const L={C:atom(),CH4:tet("C"),SiH4:tet("Si"),N2:lw([[28,50,"N"],[92,50,"N"]],[[0,1,3]],[[10,50,true],[110,50,true]]),HBr:lw([[25,50,"H"],[80,50,"Br"]],[[0,1,1]],[[80,33,false],[80,67,false],[99,50,true]]),H2S:lw([[60,38,"S"],[30,68,"H"],[90,68,"H"]],[[0,1,1],[0,2,1]],[[47,21,false],[73,21,false]]),PH3:lw([[60,42,"P"],[24,66,"H"],[96,66,"H"],[60,86,"H"]],[[0,1,1],[0,2,1],[0,3,1]],[[60,24,false]])};
const S=[
["Atomen & periodiska systemet",[
["1","Rita en kolatom och sätt ut alla elektronerna korrekt samt namnge partiklarna i kärnan.",[],[["","Kärnan: 6 protoner + 6 neutroner. Elektroner: 2 i första skalet, 4 i andra skalet (6 totalt).<br>"+L.C]]],
["2","Vad kallas de elektroner som sitter i yttersta skalet?",[],[["","Valenselektroner."]]],
["3","Vad kallas de fyra första elektronskalen och hur många elektroner kan det max finnas i vardera?",[],[["Skal 1","K-skalet – max 2"],["Skal 2","L-skalet – max 8"],["Skal 3","M-skalet – max 18"],["Skal 4","N-skalet – max 32"]]],
["4","Vad står siffrorna för i bilden? (23 och 11 vid Na, Natrium)",[],[["23","Masstal = antal protoner + neutroner"],["11","Atomnummer = antal protoner (och elektroner i neutral atom)"]]],
["5a","Vad kallas grupp 1, 17 och 18 i periodiska systemet?",[],[["Grupp 1","Alkalimetaller"],["Grupp 17","Halogener"],["Grupp 18","Ädelgaser"]]],
["5b","Varför är Beryllium, Magnesium och Kalcium i samma grupp?",[],[["","De är alla i grupp 2 och har därför lika många valenselektroner (2), vilket ger liknande egenskaper."]]],
["6","Varför är Järn, Nickel och Koppar i samma period?",[],[["","De har lika många elektronskal (alla fyra), så de står på samma rad (period 4)."]]],
["7a","Hur ser man i PS om ämnen är metaller eller icke-metaller?",[],[["","Metallerna står till vänster, icke-metallerna uppe till höger. Gränsen är en trappstegslinje där halvmetallerna ligger."]]],
["8","Hur många valenselektroner har ämnena i grupp 2? Grupp 15?",[],[["Grupp 2","2 valenselektroner"],["Grupp 15","5 valenselektroner"]]],
["9","Vilken laddning kommer nedanstående ämnen få när de blir joner?",[],[["a) Kalium","K⁺"],["b) Barium","Ba²⁺"],["c) Svavel","S²⁻"],["d) Brom","Br⁻"],["e) Kväve","N³⁻"],["f) Cesium","Cs⁺"]]],
["10","Varför bildar ämnen i grupp 16 2−-joner?",[],[["","De har 6 valenselektroner och tar upp 2 elektroner för att få ett fullt yttersta skal (8 elektroner, oktettregeln)."]]],
["11","Vilket ämne av natrium och cesium är mest reaktivt? Varför?",[],[["","Cesium. Valenselektronen sitter längre från kärnan (fler skal) och är svagare bunden, så den lämnas lättare ifrån sig."]]],
["12","Vilket ämne av syre och svavel är mest reaktivt? Varför?",[],[["","Syre. För icke-metaller ökar reaktiviteten uppåt i gruppen: syre har färre skal, så kärnan drar starkare på elektroner den ska ta upp."]]],
["13","Vilken är störst av K eller K⁺?",[],[["","K. K⁺ har förlorat sitt yttersta skal och har samma antal protoner på färre elektroner, så den är mindre."]]],
["14","Förklara så noga du kan den kemiska bindningen i litiumklorid.",[],[["","Li har 1 valenselektron, Cl har 7. Li lämnar ifrån sig sin elektron till Cl → Li⁺ och Cl⁻. De motsatta laddningarna attraherar varandra elektrostatiskt: jonbindning. Båda får fullt yttersta skal."]]],
["15","Kombinera jonerna till jonföreningar (Cl⁻, O²⁻, NO₃⁻, SO₄²⁻).",["Metallen (katjonen) skrivs alltid först."],[["Cu²⁺","CuCl₂, CuO, Cu(NO₃)₂, CuSO₄"],["Zn²⁺","ZnCl₂, ZnO, Zn(NO₃)₂, ZnSO₄"],["Pb²⁺","PbCl₂, PbO, Pb(NO₃)₂, PbSO₄"],["Ag⁺","AgCl, Ag₂O, AgNO₃, Ag₂SO₄"],["Al³⁺","AlCl₃, Al₂O₃, Al(NO₃)₃, Al₂(SO₄)₃"]]]
]],
["Formler & bindningar",[
["16","Skriv formler för följande jonföreningar.",[],[["a) Kalciumoxid","CaO"],["b) Natriumfluorid","NaF"],["c) Natriumoxid","Na₂O"],["d) Magnesiumnitrid","Mg₃N₂"],["e) Kaliumnitrat","KNO₃"],["f) Kaliumhydrid","KH"],["g) Aluminiumklorid","AlCl₃"],["h) Natriumsulfat","Na₂SO₄"],["i) Kalciumkarbonat","CaCO₃"],["j) Koppar(I)bromid","CuBr"]]],
["17a","Beskriv så noga du kan hur den kemiska bindningen i metan, CH₄, ser ut.",[],[["","Kovalent bindning: C delar ett elektronpar med var och en av fyra H (4 enkelbindningar, 8 elektroner kring C). Molekylen är en symmetrisk tetraeder.<br>"+L.CH4]]],
["17b","Beskriv så noga du kan hur den kemiska bindningen i N₂ ser ut.",[],[["","Trippelbindning (N≡N): atomerna delar 3 elektronpar. Dessutom har varje N ett fritt elektronpar. Båda får 8 elektroner kring sig.<br>"+L.N2]]],
["17c","Rita elektronformler för följande molekyler.",[],[["HBr","H–Br, Br har 3 fria elektronpar<br>"+L.HBr],["H₂S","S i mitten med två H (böjd) och 2 fria elektronpar på S<br>"+L.H2S],["SiH₄","Si i mitten med fyra enkelbindningar till H, inga fria par<br>"+L.SiH4],["PH₃","P med tre H och 1 fritt elektronpar (pyramid)<br>"+L.PH3]]],
["18","Vilken/vilka av ovanstående kemiska föreningar är en dipol? Motivera med elektronegativitet och symmetri. Föreningarna är CH₄, N₂, HBr, H₂S, SiH₄ och PH₃.",[],[["Dipoler","HBr, H₂S och PH₃"],["Varför","HBr: Br är mer elektronegativt än H. H₂S: polära bindningar och böjd, osymmetrisk form. PH₃: pyramidform med ett fritt elektronpar, alltså osymmetrisk, så dipolerna tar inte ut varandra (en svag dipol, eftersom P–H-bindningen i sig är nästan opolär)."],["Inte dipoler","CH₄ och SiH₄ är symmetriska tetraedrar så dipolerna tar ut varandra. N₂ har ingen skillnad i elektronegativitet."]]],
["19","Förklara varför molekyler av samma grundämnen inte är dipoler.",[],[["","Samma atomer har samma elektronegativitet, så elektronerna delas lika. Ingen bindning är polär och ingen sida blir delvis negativ/positiv."]]],
["20","Vilken typ av intramolekylär bindning finns i följande föreningar?",["Dipol är en egenskap hos molekylen, inte en bindningstyp."],[["Natriumfluorid","Jonbindning"],["Svaveldioxid","Kovalent bindning (polär)"],["Väteklorid","Kovalent bindning (polär)"],["Kalciumklorid","Jonbindning"],["Mässing (koppar och zink)","Metallbindning"]]],
["21","Vilken typ av intramolekylär bindning förekommer mellan:",[],[["Metall och icke-metall","Jonbindning"],["Icke-metaller","Kovalent bindning"],["Metaller","Metallbindning"]]],
["22","Vilken av nedanstående föreningar är en jonförening? a. SiCl₄ b. BF₃ c. CBr₄ d. S₂Cl₂ e. CaBr₂",[],[["","e. CaBr₂ (metall + icke-metall). Alla andra består bara av icke-metaller/halvmetaller."]]],
["23","Vilka av följande är dipoler? Varför? a. Br₂  b. HBr  c. O₂  d. CH₄  e. CH₃Cl",[],[["Dipoler","b. HBr och e. CH₃Cl. Båda har polära bindningar och osymmetrisk form."],["Inte dipoler","a. Br₂ och c. O₂ (samma atomer, ingen polaritet). d. CH₄ (polära/opolära bindningar tar ut varandra i symmetrisk tetraeder)."]]],
["24","Namnge följande jonföreningar.",[],[["a) MgCl₂","Magnesiumklorid"],["b) Na₂SO₄","Natriumsulfat"],["c) Ca(NO₃)₂","Kalciumnitrat"],["d) K₂CO₃","Kaliumkarbonat"],["e) CuSO₄","Koppar(II)sulfat"],["f) CsNO₃","Cesiumnitrat"]]]
]],
["Egenskaper & intermolekylära bindningar",[
["25","Vilket av ämnena litiumfluorid och natriumklorid har högst smältpunkt? Varför?",[],[["","Litiumfluorid. Li⁺ och F⁻ är mindre joner än Na⁺ och Cl⁻, så avståndet mellan jonerna är kortare och jonbindningen starkare. Det krävs mer energi för att bryta den."]]],
["26","Vilken av metallerna Natrium och Magnesium har starkast metallbindning? Varför?",[],[["","Magnesium. Varje Mg-atom bidrar med 2 valenselektroner (Na bara 1) och bildar 2+-joner, så attraktionen mellan jonkärnor och elektronhavet blir starkare."]]],
["27a","Vad kallas de tre intermolekylära bindningarna?",[],[["1","Dispersionsbindning (London-kraft), svagast"],["2","Dipolbindning (dipol-dipol)"],["3","Vätebindning, starkast"]]],
["27b","Vilken är starkast?",[],[["","Vätebindning."]]],
["28","Vilken typ av bindning finns mellan molekyler som inte är dipoler? Hur uppstår den?",[],[["","Dispersionsbindning. Elektronerna rör sig hela tiden och fördelas tillfälligt ojämnt, vilket ger en tillfällig dipol. Den inducerar en dipol i grannmolekylen och de attraherar varandra svagt."]]],
["29","Ange vilken intermolekylär bindning du förväntas hitta i:",[],[["Vatten H₂O","Vätebindning"],["Bensin C₈H₁₈","Dispersionsbindning"],["Ammoniak NH₃","Vätebindning"],["Saltsyra HCl","Dipolbindning"],["Svavelväte H₂S","Dipolbindning"]]]
]]];
const kd=(c,r)=>{if(r===1)return c===1||c===18?"n":null;if(r<4&&c>2&&c<13)return null;const sm={2:[13],3:[14],4:[14,15],5:[15,16],6:[17]}[r];if(sm&&sm.includes(c))return"s";const nm={2:14,3:15,4:16,5:17,6:18}[r];return nm&&c>=nm?"n":"m"};
const CL={m:"#8fb8e8",n:"#6fae5a",s:"#f2c94c"};
const ps=()=>{let s="";for(let r=1;r<=7;r++)for(let c=1;c<=18;c++){const k=kd(c,r);if(k)s+=`<rect x="${(c-1)*16+1}" y="${(r-1)*16+1}" width="15" height="15" rx="2" fill="${CL[k]}"/>`}return `<div class="fig"><svg viewBox="0 0 290 114" width="360">${s}</svg><div class="lg"><i style="background:${CL.m}"></i>Metaller<i style="background:${CL.n}"></i>Icke-metaller<i style="background:${CL.s}"></i>Halvmetaller</div></div>`};

const MOL=[mol([[50,28,12,"#e04040"],[26,54,7,H],[74,54,7,H]],[[0,1],[0,2]]),gas(),mol([[50,28,12,"#3b5bdb"],[24,54,7,H],[76,54,7,H],[50,66,7,H]],[[0,1],[0,2],[0,3]]),mol([[30,40,7,H],[62,40,13,"#3aa04a"]],[[0,1]]),mol([[50,28,14,"#e6b422"],[26,54,7,H],[74,54,7,H]],[[0,1],[0,2]])];

const figure=(n,a)=>{if(n==="7a")return ps();if(n==="3")return `<div class="fig">${tb(["Skal","Namn på skalet","Max antal elektroner"],[ ["#1","",""],["#2","",""],["#3","",""],["#4","",""] ])}</div>`;if(n==="4")return `<div class="nb"><div><span>23 →</span><span>11 →</span></div><div><b>Na</b><small>Natrium</small></div></div>`;if(n==="15")return `<div class="fig">${tb(["","Cl⁻","O²⁻","NO₃⁻","SO₄²⁻"],["Cu²⁺","Zn²⁺","Pb²⁺","Ag⁺","Al³⁺"].map(x=>["#"+x,"","","","])).replace(/\"\],\"\"/g, '
